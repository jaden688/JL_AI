# Dependencies the JL Engine provisions for ITSELF on first run.
#
# CondaPkg (via PythonCall) creates a private Python environment inside the app's
# own depot the first time a browser feature is used — the user never installs
# Python or anything else. On a machine with no Python at all, CondaPkg downloads
# a self-contained interpreter automatically.
#
# The core engine never touches this; it only spins up when browser / Mission
# Control features are invoked. If provisioning fails, the engine degrades
# gracefully and keeps running.

[deps]
python = ">=3.10,<3.13"

[pip.deps]
# Chromium itself is fetched by `playwright install chromium`, triggered lazily
# on first browser launch (see _start_browser_context in src/App.jl).
playwright = ">=1.40"
